<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" fill="none">
  <title>Waste detection and classification research pipeline</title>
  <desc>A proposed pipeline that detects waste objects, crops each object, and classifies its material.</desc>
  <defs>
    <linearGradient id="background" x2="960" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0c1c30"/>
      <stop offset="1" stop-color="#070d19"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#65c6f4" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="960" height="540" rx="24" fill="url(#background)"/>
  <rect width="960" height="540" rx="24" fill="url(#grid)"/>
  <g font-family="Arial, sans-serif">
    <text x="64" y="78" fill="#8bd8fa" font-size="17" letter-spacing="3">COMPUTER VISION RESEARCH</text>
    <text x="64" y="128" fill="#e8eef5" font-size="34" font-weight="700">From waste objects to material classes</text>
    <g stroke="#65c6f4" stroke-width="2">
      <rect x="64" y="178" width="232" height="210" rx="16" fill="#101e32"/>
      <rect x="364" y="178" width="232" height="210" rx="16" fill="#101e32"/>
      <rect x="664" y="178" width="232" height="210" rx="16" fill="#101e32"/>
      <path d="M312 283h36m-10-10 10 10-10 10M612 283h36m-10-10 10 10-10 10" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g stroke="#8bd8fa" stroke-width="3" stroke-linejoin="round">
      <path d="M155 223h24v19l10 15v45h-44v-45l10-15z" fill="#65c6f4" fill-opacity=".12"/>
      <path d="M215 271h33l-4 33h-25z" fill="#65c6f4" fill-opacity=".12"/>
      <path d="M133 215h-12v12m83-12h12v12m-95 78v12h12m83-12v12h-12" stroke="#7be0b7"/>
      <rect x="432" y="218" width="96" height="96" rx="6" stroke-dasharray="6 5"/>
      <path d="M468 235h24v17l10 13v34h-44v-34l10-13z" fill="#65c6f4" fill-opacity=".12"/>
    </g>
    <g fill="#a4afc1" font-size="17">
      <text x="180" y="363" text-anchor="middle">YOLO detector</text>
      <text x="480" y="363" text-anchor="middle">Individual objects</text>
      <text x="780" y="363" text-anchor="middle">CNN classifier</text>
    </g>
    <g fill="#e8eef5" font-size="21" font-weight="700" text-anchor="middle">
      <text x="180" y="422">01 / Detect</text>
      <text x="480" y="422">02 / Crop</text>
      <text x="780" y="422">03 / Classify</text>
    </g>
    <g font-size="17">
      <rect x="698" y="220" width="164" height="38" rx="8" fill="#7be0b7" fill-opacity=".12"/>
      <text x="714" y="245" fill="#7be0b7">Plastic</text>
      <text x="714" y="283" fill="#a4afc1">Metal</text>
      <text x="714" y="316" fill="#a4afc1">Paper · Glass · …</text>
    </g>
    <text x="480" y="488" text-anchor="middle" fill="#a4afc1" font-size="18">Proposed pipeline · Dataset composition &amp; model efficiency</text>
  </g>
</svg>
